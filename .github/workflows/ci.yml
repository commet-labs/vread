name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        allowlist: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.allowlist
        run: "sed -i 's/enabled: false/enabled: true/' access-policy.ts"
      - run: pnpm catalog:check
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:e2e
